[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intuitive-pantry-backend"
version = "1.0.0"
description = "Intuitive pantry FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "httpx==0.28.1",
  "psycopg[binary,pool]==3.3.6", "cryptography==50.0.1", "PyJWT==2.15.0",
  "python-dotenv==1.2.3", "pymupdf==1.26.7", "google-auth[requests]==2.59.1", "google-cloud-storage==3.16.0",
]

[tool.setuptools.packages.find]
include = ["pantry*"]

[tool.setuptools.package-data]
pantry = ["*.sql", "*.json", "*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["postgres: requires PANTRY_TEST_POSTGRES_URL pointing to a disposable PostgreSQL database"]
